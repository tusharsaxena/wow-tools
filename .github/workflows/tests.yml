name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Two jobs (spec F4): Windows on a recent Python, Linux on the floor. WSL and native Windows run locally in
        # the green gate (run_tests.py --all); CI is checked once before a merge into master and before a release.
        include:
          - {os: windows-latest, python: "3.13"}
          - {os: ubuntu-latest, python: "3.10"}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Python version
        run: python --version
      - name: Byte-compile
        run: python -m compileall -q wowtools scripts tests
      - name: Event docs are current
        run: python scripts/gen_event_docs.py --check
      - name: Tests
        # No -j: the default shard count (6 on a 4-vCPU runner; docs/testing.md). A fresh checkout has no
        # .test-times-*.json (gitignored; no cache step), so CI deals its shards round-robin, never balanced. A slow
        # Windows runner once took 594 s for one round-robin shard of 4; 900 s still fails a hang with its test's
        # name well inside the job's 20 minutes (the 6-shard Windows job is checked against both at the merge).
        run: python scripts/run_tests.py --timeout 900
