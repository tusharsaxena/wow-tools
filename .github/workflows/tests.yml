name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Two jobs (spec F4): Windows on a recent Python, Linux on the floor. WSL and native Windows run locally in
        # the green gate (run_tests.py --all); CI is checked once before a merge into master and before a release.
        include:
          - {os: windows-latest, python: "3.13"}
          - {os: ubuntu-latest, python: "3.10"}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Python version
        run: python --version
      - name: Byte-compile
        run: python -m compileall -q wowtools scripts tests
      - name: Event docs are current
        run: python scripts/gen_event_docs.py --check
      - name: Tests
        # No -j: the default shard count (6 on a 4-vCPU runner; docs/testing.md). A fresh checkout has no
        # .test-times-*.json (gitignored; no cache step), so CI deals its shards round-robin, never balanced. At
        # 2426 tests (2026-11-05) Linux's slowest round-robin shard took 844 s, and one run hit the old 900 s limit
        # with every test passing; 1500 s leaves room to grow and still fails a hang with its test's name inside
        # the job's 30 minutes (both jobs' slowest shards are checked against it at the merge).
        run: python scripts/run_tests.py --timeout 1500
